<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <meta
      name="google-site-verification"
      content="xWX5to9dHEfGfWIhL3Mkb9dZtmWR0SrE9AIQEzW177A"
    />
    <title>Propatyc — Real Estate, Video Tours &amp; Site Visits</title>

    <meta
      name="description"
      content="Propatyc is a modern platform for buying, selling, and renting properties with walkthrough video tours and coordinated site visits."
    />
    <meta
      name="keywords"
      content="Propatyc, Real Estate, Buy Property, Sell Property, Rent Property, Video Tours, Site Visits"
    />
    <meta name="author" content="Propatyc" />

    <!-- Open Graph -->
    <meta property="og:title" content="Propatyc — Real Estate &amp; Video Tours" />
    <meta
      property="og:description"
      content="Discover houses, rooms, and plots with walkthrough videos and coordinated site visits."
    />
    <meta property="og:image" content="/web-app-manifest-512x512.png" />
    <meta property="og:url" content="https://propatyc.vercel.app" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Propatyc — Real Estate &amp; Video Tours" />
    <meta
      name="twitter:description"
      content="Discover houses, rooms, and plots with walkthrough videos and coordinated site visits."
    />
    <meta name="twitter:image" content="/web-app-manifest-512x512.png" />

    <!-- Icons -->
    <link rel="canonical" href="https://propatyc.vercel.app/" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Typography: Plus Jakarta Sans + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark =
            saved === "dark" || ((!saved || saved === "system") && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (_) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
